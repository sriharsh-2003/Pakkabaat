name: Build PakkaBaat APK (local-asr)

on:
  push:
    branches: [ local-asr ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo (with the whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Downloads the ~57MB quantized Whisper model straight into assets, so the APK
      # this produces actually works out of the box — no local NDK setup needed on
      # your end at all if you're happy building through this workflow.
      - name: Download the on-device speech model
        run: |
          mkdir -p app/src/main/assets/models
          rm -f app/src/main/assets/models/PUT_MODEL_HERE.txt
          curl -L -o app/src/main/assets/models/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin

      - name: Inject API key (optional fallback — testers normally use Settings/BYOK instead)
        run: echo "PAKKABAAT_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> gradle.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakkaBaat-local-asr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakkaBaat-local-asr-release-apk
          path: app/build/outputs/apk/release/app-release.apk
